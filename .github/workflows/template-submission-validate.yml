name: Template submission — validate

# Front door (ADR-0009), step 1: when a workshop-template issue is opened or
# edited, parse the form, validate it through orchestra-render-template, and
# comment the result on the issue. No PR — that's the convert workflow, gated
# on a maintainer adding the `approve` label.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: template-validate-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'workshop-template')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: template-tools/uv.lock

      - name: Install template-tools CLI
        run: uv tool install ./template-tools

      - name: Validate submission and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # render exits 1 on invalid input; `|| true` so we can read the JSON.
          result=$(printf '%s' "$ISSUE_BODY" \
            | orchestra-render-template --issue-body --validate || true)
          if [ "$(jq -r '.ok' <<<"$result")" = "true" ]; then
            body=$'✓ **Valid** — a maintainer can add the `approve` label to open the PR.'

            # Advisories: schema-valid submissions that would still do the wrong
            # thing. Warn, don't block — a maintainer decides on `approve`.
            slug=$(jq -r '.slug' <<<"$result")
            for ext in yaml yml; do
              f="deploy/charts/orchestra/files/templates/${slug}.${ext}"
              if [ -f "$f" ]; then
                body+=$'\n\n⚠️ Slug `'"$slug"$'` already exists — approving will **update** `'"$f"$'`, not add a new workshop. Pick a different slug if you meant to add one.'
              fi
            done

            # Nodes are amd64; an arm64-only image pulls then fails to exec.
            # ponytail: anonymous inspect only — a private image just skips the check.
            image=$(jq -r '.yaml' <<<"$result" | awk '/^image: /{print $2; exit}')
            archs=$(docker manifest inspect -v "$image" 2>/dev/null \
              | jq -r '[.] | flatten | .[].Descriptor.platform.architecture' | sort -u || true)
            if [ -n "$archs" ] && ! grep -qx amd64 <<<"$archs"; then
              body+=$'\n\n⚠️ `'"$image"$'` has no `linux/amd64` manifest (found: '"$(tr '\n' ' ' <<<"$archs")"$'). The cluster nodes are amd64 — build multi-arch: `docker buildx build --platform linux/amd64,linux/arm64 --push`.'
            fi
          else
            errs=$(jq -r '.errors[] | "- " + .' <<<"$result")
            body=$'❌ **Validation failed.** Fix the fields below by **editing the issue description** (the form you filled in) — validation re-runs on every edit. Commenting does *not* re-run it.\n\n'"$errs"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
